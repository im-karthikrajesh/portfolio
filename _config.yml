title: "Karthik Rajesh"
logo: /assets/img/headshot.png

# Brief, hiring-focused description for SEO/snippets and the left rail
description: >-
  MSc Business Analytics graduate with 4.5+ years of commercial experience in software engineering,
  data integration and analytics-driven solution delivery. I build scalable backend services,
  production-grade data workflows, enterprise integrations and applied ML solutions that improve
  operational efficiency and support data-driven decision-making.

# Theme & site basics
theme: jekyll-theme-minimal
show_downloads: false
lang: en
locale: en_GB
timezone: Europe/London
permalink: pretty
title_separator: " — "   # Used by jekyll-seo-tag for <title> formatting

# Correct URLs for GitHub Pages under /portfolio
url: "https://im-karthikrajesh.github.io"
baseurl: "/portfolio"

# Social / contact
author:
  name: "Karthik Rajesh"
  email: "karthikrajesh5@gmail.com"
  github: "https://github.com/im-karthikrajesh"
  linkedin: "https://www.linkedin.com/in/karthikrajesh05"

# Default social preview image
image: /assets/img/headshot.png

# Build
markdown: kramdown
kramdown:
  input: GFM

# SEO & Sitemap (both supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep build tidy
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
