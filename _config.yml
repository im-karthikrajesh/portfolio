title: "Karthik Rajesh"
logo: /assets/img/headshot.png
role: "Lead Software Engineer"

# Brief, hiring-focused description for SEO/snippets and the left rail
description: >-
  Lead Software Engineer with 5+ years of commercial experience designing and delivering production software, AI-enabled products, backend systems, cloud-native applications and enterprise integrations.
  I lead complex technical initiatives end-to-end, from requirements and architecture through development, integration and production deployment, with a focus on scalability, security and reliability.
  MSc Business Analytics graduate from the University of Nottingham, with applied expertise in artificial intelligence, machine learning, predictive modelling and data engineering.
  I combine technical leadership, practical problem-solving and a data-driven approach to deliver high-quality solutions that address complex business challenges and improve operational efficiency.

# Theme & site basics
theme: jekyll-theme-minimal
show_downloads: false
lang: en
locale: en_GB
timezone: Europe/London
permalink: pretty
title_separator: " — "   # Used by jekyll-seo-tag for <title> formatting

# Correct URLs for GitHub Pages under /portfolio
url: "https://im-karthikrajesh.github.io"
baseurl: "/portfolio"

# Social / contact
author:
  name: "Karthik Rajesh"
  email: "karthik_rajesh@outlook.com"
  github: "https://github.com/im-karthikrajesh"
  linkedin: "https://www.linkedin.com/in/karthikrajesh05"

# Default social preview image
image: /assets/img/headshot.png

# Build
markdown: kramdown
kramdown:
  input: GFM

# SEO & Sitemap (both supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep build tidy
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
